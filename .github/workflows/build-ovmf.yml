name: EDK2 OVMF X64 Build

on:
  push:
    branches: [main]
    paths:
      - "edk2"
      - "edk2-platforms"
      - "scripts/build-linux.sh"
      - "scripts/build-windows.cmd"
      - "scripts/pip-requirements-ovmf.txt"
      - ".github/workflows/build-ovmf.yml"
  pull_request:
    paths:
      - "edk2"
      - "edk2-platforms"
      - "scripts/build-linux.sh"
      - "scripts/build-windows.cmd"
      - "scripts/pip-requirements-ovmf.txt"
      - ".github/workflows/build-ovmf.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ovmf:
    name: OVMF X64 / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            toolchain: GCC
          - os: windows-2022
            toolchain: VS2022
    steps:
      - name: Checkout workspace (OVMF initializes core EDK2 only)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm acpica-tools uuid-dev python3-venv python3-dev swig

      - name: Build OVMF (Linux / GCC)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/build-linux.sh RELEASE

      - name: Install Windows NASM and iASL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm iasl -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey install failed" }
          # Chocolatey NASM installer adds PATH only for new Windows sessions.
          # Persist the install directory for the next GitHub Actions step.
          $candidates = @(
            (Join-Path $env:ProgramFiles "NASM"),
            (Join-Path ${env:ProgramFiles(x86)} "NASM"),
            (Join-Path $env:ChocolateyInstall "lib/nasm/tools")
          )
          $nasm = $null
          foreach ($root in $candidates) {
            if (Test-Path $root) {
              $nasm = Get-ChildItem -Path $root -Filter nasm.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($nasm) { break }
            }
          }
          if (-not $nasm) { throw "NASM installation succeeded, but nasm.exe was not found" }
          $nasm.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "NASM: $($nasm.FullName)"

      - name: Build OVMF (Windows / VS2022)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x86
          call scripts\build-windows.cmd RELEASE

      - name: Upload firmware and build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ovmf-x64-${{ matrix.toolchain }}
          if-no-files-found: warn
          path: |
            edk2/Build/**/FV/OVMF.fd
            artifacts/*-build-report.txt
