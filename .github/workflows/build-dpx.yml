name: DpX X64 Standalone Build

on:
  push:
    branches: [main]
    paths:
      - "CommonToolsPkg/**"
      - "scripts/build-dpx-linux.sh"
      - "scripts/test-dpx-ovmf.sh"
      - "tests/dpx/**"
      - "scripts/build-dpx-windows.cmd"
      - ".github/workflows/build-dpx.yml"
  pull_request:
    paths:
      - "CommonToolsPkg/**"
      - "scripts/build-dpx-linux.sh"
      - "scripts/test-dpx-ovmf.sh"
      - "tests/dpx/**"
      - "scripts/build-dpx-windows.cmd"
      - ".github/workflows/build-dpx.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dpx:
    name: DpX X64 / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            toolchain: GCC
          - os: windows-2022
            toolchain: VS2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux requirements
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm acpica-tools uuid-dev python3-venv python3-dev swig

      - name: Verify synthetic PI FV fixtures
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tests/dpx -p 'test_*.py' -v

      - name: Build DpX (Linux GCC)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/build-dpx-linux.sh RELEASE

      - name: Install OVMF runtime test tools
        if: runner.os == 'Linux'
        run: sudo apt-get install -y qemu-system-x86 ovmf dosfstools mtools

      - name: Execute DpX.efi in QEMU OVMF Shell
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/test-dpx-ovmf.sh artifacts/dpx/DpX-GCC-X64-RELEASE.efi

      - name: Install Windows NASM and iASL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm iasl -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey install failed" }
          $candidates = @(
            (Join-Path $env:ProgramFiles "NASM"),
            (Join-Path ${env:ProgramFiles(x86)} "NASM"),
            (Join-Path $env:ChocolateyInstall "lib/nasm/tools")
          )
          $nasm = $null
          foreach ($root in $candidates) {
            if (Test-Path $root) {
              $nasm = Get-ChildItem -Path $root -Filter nasm.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($nasm) { break }
            }
          }
          if (-not $nasm) { throw "nasm.exe was not found" }
          $nasm.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build DpX (Windows VS2022)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x86
          call scripts\build-dpx-windows.cmd RELEASE

      - name: Upload DpX application
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DpX-X64-${{ matrix.toolchain }}-unsigned
          path: artifacts/dpx/*.efi
          if-no-files-found: error
